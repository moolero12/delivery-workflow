name: Discord PR notification publisher

on:
  workflow_run:
    workflows: [Discord PR notification trigger]
    types: [completed]

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: discord-pr-notifications
    concurrency:
      group: discord-pr-relations
      queue: max
      cancel-in-progress: false
    permissions:
      actions: read
      issues: write
      pull-requests: read
    steps:
      # Sustituir el marcador por el SHA de main de la release v0.2.0.
      - uses: venturars/delivery-workflow/.github/actions/discord-pr-notifications@REPLACE_WITH_V0_2_0_COMMIT_SHA
        with:
          github-token: ${{ github.token }}
          bot-token: ${{ secrets.DISCORD_BOT_TOKEN }}
          cache-key: ${{ secrets.DISCORD_CACHE_KEY }}
          guild-id: ${{ vars.DISCORD_GUILD_ID }}
          channel-id: ${{ vars.DISCORD_GIT_CHANNEL_ID }}
          expected-repository: venturars/aTempo
          base-branch: staging
          trigger-run-id: ${{ github.event.workflow_run.id }}
